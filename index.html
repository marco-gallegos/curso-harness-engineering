<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso de Harness Engineering para Profesionales No Técnicos</title>

  <!-- ===== SEO & Open Graph (link preview) ===== -->
  <meta name="description" content="Aprende Harness Engineering desde cero: agentes de IA, Markdown, Mermaid, Prompt Engineering y servidores MCP — sin necesidad de programar.">
  <meta name="keywords" content="harness engineering, inteligencia artificial, agentes IA, prompt engineering, Markdown, Mermaid, MCP, curso IA no técnicos">
  <meta name="author" content="Marco Gallegos">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://marco-gallegos.github.io/curso-harness-engineering/">

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack…) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://marco-gallegos.github.io/curso-harness-engineering/">
  <meta property="og:title" content="Curso de Harness Engineering para Profesionales No Técnicos">
  <meta property="og:description" content="De usuario de chatbots a Harness Engineer Practitioner en 4 fases. Aprende a estructurar agentes de IA, diseñar prompts efectivos y conectar herramientas MCP — sin programar.">
  <meta property="og:image" content="https://marco-gallegos.github.io/curso-harness-engineering/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Curso de Harness Engineering — Plataforma interactiva con 9 módulos">
  <meta property="og:locale" content="es_MX">
  <meta property="og:site_name" content="Harness Engineering Course">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://marco-gallegos.github.io/curso-harness-engineering/">
  <meta name="twitter:title" content="Curso de Harness Engineering para Profesionales No Técnicos">
  <meta name="twitter:description" content="De usuario de chatbots a Harness Engineer Practitioner en 4 fases. Agentes IA, Markdown, Mermaid, Prompt Engineering y MCP — sin programar.">
  <meta name="twitter:image" content="https://marco-gallegos.github.io/curso-harness-engineering/assets/og-image.png">

  <!-- Tema de color para navegadores móviles -->
  <meta name="theme-color" content="#4f46e5">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>

  <!-- Mermaid.js CDN para Diagramas como Código -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col antialiased transition-colors duration-200">

  <!-- ================= TOP NAVBAR ================= -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Lado Izquierdo: Botón Menú Móvil + Logo -->
      <div class="flex items-center gap-3">
        <button 
          onclick="window.HarnessApp.toggleMobileSidebar()"
          class="lg:hidden p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none"
          aria-label="Abrir Menú de Módulos"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.HarnessApp.goToStep(0)">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </div>
          <div>
            <h1 class="text-sm font-bold tracking-tight text-slate-900 dark:text-white leading-tight">Harness Engineering</h1>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">Para Profesionales No Técnicos</p>
          </div>
        </div>
      </div>

      <!-- Centro: Barra Resumida de Progreso (Desktop) -->
      <div class="hidden md:flex items-center gap-3 flex-1 max-w-xs mx-4">
        <div class="flex-1 bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="global-progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <span id="global-progress-percentage" class="text-xs font-bold text-indigo-600 dark:text-indigo-400">0%</span>
      </div>

      <!-- Lado Derecho: Acciones (Tema, Reset, Ayuda) -->
      <div class="flex items-center gap-2">
        <!-- Modo Claro / Oscuro -->
        <button 
          id="theme-toggle-btn"
          onclick="window.HarnessApp.toggleTheme()"
          class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          title="Cambiar tema claro/oscuro"
          aria-label="Cambiar tema"
        >
          <span id="theme-toggle-icon">
            <svg class="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          </span>
        </button>

        <!-- Reiniciar Avance -->
        <button 
          onclick="window.HarnessApp.resetAllProgress()"
          class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"
          title="Reiniciar progreso guardado"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>

        <!-- Ir directo a evaluación -->
        <button 
          onclick="window.HarnessApp.goToStep(9)"
          class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 text-xs font-semibold hover:bg-purple-100 transition-colors"
        >
          <span>🏆 Examen</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ================= CUERPO PRINCIPAL ================= -->
  <div class="app-layout max-w-7xl mx-auto w-full relative">

    <!-- SIDEBAR / WIZARD STEPPER (Desktop Fijo / Mobile Drawer) -->
    <aside 
      id="sidebar-drawer"
      class="border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"
    >
      <!-- Cabecera del Sidebar -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Ruta de Aprendizaje</span>
          <h2 class="text-sm font-bold text-slate-900 dark:text-white">Módulos del Curso</h2>
        </div>
        <button 
          onclick="window.HarnessApp.toggleMobileSidebar()"
          class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Resumen de Progreso en Sidebar -->
      <div class="px-4 py-3 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 mb-1.5">
          <span>Progreso</span>
          <span id="global-progress-label" class="font-bold text-slate-800 dark:text-slate-200">0 de 10 módulos</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
          <div id="sidebar-progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <!-- Lista de Módulos (Scrollable) -->
      <div class="flex-1 overflow-y-auto p-3" id="sidebar-steps-list">
        <!-- Renderizado dinámicamente por app.js -->
      </div>

      <!-- Pie del Sidebar -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
        <span>Almacenado localmente</span>
        <span class="font-mono text-emerald-500">● Sincronizado</span>
      </div>
    </aside>

    <!-- Overlay oscuro en móvil al abrir el drawer -->
    <div 
      onclick="window.HarnessApp.toggleMobileSidebar()"
      id="sidebar-backdrop"
    ></div>

    <!-- CONTENEDOR PRINCIPAL DEL CONTENIDO -->
    <main class="app-main flex-1 flex flex-col min-w-0 pt-6">
      
      <!-- ÁREA DE CONTENIDO INYECTADA -->
      <div id="step-content-area" class="w-full">
        <div class="flex items-center justify-center p-12 text-slate-400">
          <svg class="animate-spin h-6 w-6 mr-3 text-indigo-600" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Cargando contenido interactivo...</span>
        </div>
      </div>

    </main>

  </div>

  <!-- ================= BARRA FLOTANTE STEPPER (BOTTOM NAVIGATION) ================= -->
  <footer class="fixed bottom-0 inset-x-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-3 shadow-lg">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">
      
      <!-- Botón Anterior -->
      <button 
        id="stepper-prev-btn"
        onclick="window.HarnessApp.prevStep()"
        class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs sm:text-sm transition-all focus:outline-none"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <span class="hidden sm:inline">Paso Anterior</span>
        <span class="sm:hidden">Anterior</span>
      </button>

      <!-- Indicador central de pasos -->
      <div class="flex flex-col items-center">
        <span id="stepper-indicator" class="text-xs font-bold text-slate-800 dark:text-slate-200">
          Paso 1 de 10
        </span>
        <span class="text-[10px] text-slate-400 hidden sm:block">Usa las teclas ← y →</span>
      </div>

      <!-- Botón Siguiente -->
      <button 
        id="stepper-next-btn"
        onclick="window.HarnessApp.nextStep()"
        class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm shadow-md shadow-indigo-500/20 transition-all focus:outline-none"
      >
        <span>Siguiente Módulo</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>

    </div>
  </footer>

  <!-- Scripts del Sistema -->
  <script src="assets/js/modulesData.js"></script>
  <script src="assets/js/quizData.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
